<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NutriDeck — Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0" rel="stylesheet">
<style>
  :root{
    --bg:          #ffffff;
    --bg-raised:   #ffffff;
    --bg-sunken:   #f7f7f5;
    --text:        #37352f;
    --text-dim:    #9b9a97;
    --border:      #eceae7;
    --border-soft: #f1efec;
    --accent:      #37352f;
    --shadow:      0 1px 2px rgba(15,15,15,.06), 0 2px 8px rgba(15,15,15,.04);

    --meal-1-bg:#f4e9d8; --meal-1-tx:#6b4a1e;
    --meal-2-bg:#dceae3; --meal-2-tx:#1f5c46;
    --meal-3-bg:#dce6f0; --meal-3-tx:#244a73;
    --meal-4-bg:#e6e0f0; --meal-4-tx:#4a3b73;
    --meal-5-bg:#f2dede; --meal-5-tx:#7a3030;

    --done-bg: #f1efec;
    --done-tx: #b3b1ac;
  }

  :root[data-theme="dark"]{
    --bg:          #191919;
    --bg-raised:   #202020;
    --bg-sunken:   #1f1f1f;
    --text:        #e9e9e7;
    --text-dim:    #8f8d88;
    --border:      #2f2f2f;
    --border-soft: #2a2a2a;
    --accent:      #e9e9e7;
    --shadow:      0 1px 2px rgba(0,0,0,.4), 0 2px 10px rgba(0,0,0,.28);

    --meal-1-bg:#332a1a; --meal-1-tx:#e8c989;
    --meal-2-bg:#1c2f28; --meal-2-tx:#8fd9bd;
    --meal-3-bg:#1e2c3a; --meal-3-tx:#9cc2e8;
    --meal-4-bg:#292236; --meal-4-tx:#c7b7e8;
    --meal-5-bg:#332222; --meal-5-tx:#e3a8a8;

    --done-bg: #232323;
    --done-tx: #6f6d68;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    transition:background .2s ease, color .2s ease;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  .mono{font-family:'Fira Code',ui-monospace,monospace;}

  .material-symbols-rounded{
    font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24;
    font-size:22px;
    line-height:1;
    user-select:none;
  }
  .material-symbols-rounded.is-filled{
    font-variation-settings:'FILL' 1,'wght' 300,'GRAD' 0,'opsz' 24;
  }

  /* ---------- App shell : single centered column, same on mobile & desktop ---------- */
  .App{
    max-width:520px;
    margin:0 auto;
    padding:20px 18px 110px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  /* ---------- Top bar ---------- */
  .TopBar{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .TopBar-title{
    font-family:'Fira Code';
    font-weight:600;
    font-size:16px;
    letter-spacing:-0.01em;
  }
  .TopBar-title span{color:var(--text-dim);}
  .IconBtn{
    width:36px;height:36px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--bg-raised);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .IconBtn:hover{background:var(--bg-sunken);}

  /* ---------- Section heading ---------- */
  .SectionHead{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:10px;
  }
  .SectionHead h2{
    font-family:'Fira Code';
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.09em;
    color:var(--text-dim);
    margin:0;
  }
  .SectionHead .meta{
    font-family:'Fira Code';
    font-size:12px;
    color:var(--text-dim);
  }

  /* ---------- Day rail ---------- */
  .DayRail{
    display:flex;
    gap:8px;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
    padding:2px 2px 4px;
  }
  .DayRail::-webkit-scrollbar{display:none;}

  .DayCard{
    scroll-snap-align:start;
    flex:0 0 auto;
    width:56px;
    padding:10px 0 9px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--bg-raised);
    color:var(--text-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    cursor:pointer;
  }
  .DayCard-dow{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
  .DayCard-num{font-family:'Fira Code';font-size:17px;font-weight:600;color:var(--text);}
  .DayCard-dot{width:4px;height:4px;border-radius:50%;background:var(--meal-3-tx);opacity:0;}
  .DayCard.is-done .DayCard-dot{opacity:.8;background:var(--meal-2-tx);}

  .DayCard.is-active{
    background:var(--text);
    border-color:var(--text);
    color:var(--bg);
  }
  .DayCard.is-active .DayCard-num{color:var(--bg);}

  /* ---------- Rolodex stack ---------- */
  .Stack{
    position:relative;
    height:300px;
  }
  .Stack-empty{
    position:absolute;inset:0;
    border:1px dashed var(--border);
    border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);
    text-align:center;padding:24px;
    font-size:14px;
  }

  .MealCard{
    position:absolute;
    left:0;right:0;
    bottom:0;
    height:180px;
    border-radius:16px;
    border:1px solid rgba(0,0,0,.04);
    padding:16px 18px;
    display:flex;
    flex-direction:column;
    box-shadow:var(--shadow);
    will-change:transform;
    transition:transform .3s cubic-bezier(.2,.8,.2,1), opacity .3s ease, box-shadow .2s ease;
    user-select:none;
  }
  .MealCard.is-front{cursor:grab;}
  .MealCard.is-front:active{cursor:grabbing;}
  .MealCard.is-dragging{transition:none;}
  .MealCard.is-peek{cursor:pointer;}

  .MealCard.c1{background:var(--meal-1-bg);color:var(--meal-1-tx);}
  .MealCard.c2{background:var(--meal-2-bg);color:var(--meal-2-tx);}
  .MealCard.c3{background:var(--meal-3-bg);color:var(--meal-3-tx);}
  .MealCard.c4{background:var(--meal-4-bg);color:var(--meal-4-tx);}
  .MealCard.c5{background:var(--meal-5-bg);color:var(--meal-5-tx);}

  .MealCard-top{
    display:flex;justify-content:space-between;align-items:flex-start;
  }
  .MealCard-time{font-family:'Fira Code';font-weight:600;font-size:16px;}
  .MealCard-tag{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    background:rgba(0,0,0,.08);
    padding:4px 9px;border-radius:20px;
  }
  .MealCard-name{
    font-weight:600;
    font-size:16px;
    line-height:1.3;
    margin-top:auto;
  }
  .MealCard-desc{
    font-size:12.5px;
    opacity:.75;
    margin-top:4px;
    line-height:1.4;
  }
  .MealCard-foot{
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .MealCard-hint{
    font-size:11px;font-weight:600;opacity:.6;
    display:flex;align-items:center;gap:4px;
  }
  .MealCard-actions{display:flex;gap:6px;}
  .MealCard-actionBtn{
    width:30px;height:30px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,.08);
    color:inherit;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .MealCard-actionBtn .material-symbols-rounded{font-size:18px;}
  .MealCard-actionBtn:hover{background:rgba(0,0,0,.14);}

  .SwipeGhost{
    position:absolute;top:0;bottom:0;width:50%;
    display:flex;align-items:center;
    font-family:'Fira Code';font-weight:600;font-size:13px;
    opacity:0;
    pointer-events:none;
    gap:6px;
  }
  .SwipeGhost.left{left:0;justify-content:flex-start;padding-left:18px;color:#1f5c46;}
  .SwipeGhost.right{right:0;justify-content:flex-end;padding-right:18px;color:#6b4a1e;}

  /* completed chips row */
  .DoneRow{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:14px;
  }
  .DoneChip{
    font-size:12px;
    font-weight:500;
    background:var(--done-bg);
    color:var(--done-tx);
    padding:6px 12px;
    border-radius:20px;
    display:flex;align-items:center;gap:6px;
    text-decoration:line-through;
    cursor:pointer;
    border:1px solid var(--border-soft);
  }
  .DoneChip .material-symbols-rounded{font-size:14px;text-decoration:none;}

  /* ---------- Action row ---------- */
  .Actions{display:flex;gap:10px;}
  .Btn{
    flex:1;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    background:var(--bg-raised);
    color:var(--text);
  }
  .Btn:hover{background:var(--bg-sunken);}
  .Btn.is-primary{background:var(--text);color:var(--bg);border-color:var(--text);}

  /* ---------- Stats / summary section ---------- */
  .Panel{
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:16px;
    padding:18px;
  }
  .Panel + .Panel{margin-top:12px;}
  .Panel h3{
    margin:0 0 14px;
    font-family:'Fira Code';
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--text-dim);
  }

  .WeekGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .WeekGrid-cell{
    aspect-ratio:1;
    border-radius:8px;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-family:'Fira Code';
    font-size:11px;font-weight:600;
    background:var(--bg-sunken);
    color:var(--text-dim);
  }
  .WeekGrid-cell.is-active{background:var(--text);color:var(--bg);border-color:var(--text);}
  .WeekGrid-cell.is-full{background:var(--meal-2-bg);color:var(--meal-2-tx);border-color:transparent;}

  .ProgressRow{display:flex;align-items:center;gap:12px;margin-bottom:9px;}
  .ProgressRow:last-child{margin-bottom:0;}
  .ProgressRow-label{width:112px;font-size:12.5px;font-weight:500;color:var(--text-dim);}
  .ProgressBar{flex:1;height:6px;border-radius:6px;background:var(--bg-sunken);overflow:hidden;}
  .ProgressBar > span{display:block;height:100%;background:var(--meal-2-tx);border-radius:6px;}
  .ProgressRow-val{font-family:'Fira Code';font-size:11px;color:var(--text-dim);width:32px;text-align:right;}

  .PlanList{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;}
  .PlanList li{
    display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;
    font-size:13px;font-weight:500;
    border-bottom:1px solid var(--border-soft);
  }
  .PlanList li:last-child{border-bottom:none;}
  .PlanList li span.dim{color:var(--text-dim);font-family:'Fira Code';font-size:12.5px;}

  /* ---------- Floating bottom nav ---------- */
  .NavBar{
    position:fixed;
    left:0;right:0;bottom:0;
    display:flex;
    justify-content:center;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    pointer-events:none;
  }
  .NavBar-inner{
    pointer-events:auto;
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--bg-raised);
    border:1px solid var(--border);
    border-radius:20px;
    padding:8px 10px;
    box-shadow:var(--shadow);
  }
  .NavBar-item{
    width:46px;height:44px;
    border:none;
    background:transparent;
    color:var(--text-dim);
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .NavBar-item:hover{background:var(--bg-sunken);}
  .NavBar-item.is-active{color:var(--text);}
</style>
</head>
<body>

<div class="App">

  <div class="TopBar">
    <div class="TopBar-title">nutri<span>deck</span></div>
    <button class="IconBtn" id="btnTheme" title="Modo claro/oscuro">
      <span class="material-symbols-rounded" id="themeIcon">dark_mode</span>
    </button>
  </div>

  <div id="secToday">
    <div class="SectionHead"><h2>Semana</h2><span class="meta" id="weekRange">SEM 38</span></div>
    <div class="DayRail" id="dayRail"></div>
  </div>

  <div>
    <div class="SectionHead">
      <h2>Hoy toca</h2>
      <span class="meta" id="dayCount">0/0</span>
    </div>
    <div class="Stack" id="stack"></div>
    <div class="DoneRow" id="doneRow"></div>
  </div>

  <div class="Actions">
    <button class="Btn" id="btnAddMeal">
      <span class="material-symbols-rounded">add</span> Agregar comida
    </button>
    <button class="Btn is-primary" id="btnDiet">
      <span class="material-symbols-rounded">tune</span> Set dieta
    </button>
  </div>

  <div id="secStats">
    <div class="SectionHead"><h2>Resumen</h2></div>
    <div class="Panel">
      <h3>Progreso de la semana</h3>
      <div class="WeekGrid" id="weekGrid"></div>
    </div>
    <div class="Panel">
      <h3>Avance de hoy</h3>
      <div id="progressRows"></div>
    </div>
    <div class="Panel" id="secProfile">
      <h3>Plan activo</h3>
      <ul class="PlanList">
        <li>Objetivo <span class="dim">recomposición</span></li>
        <li>Nutriólogo <span class="dim">Dra. Marín</span></li>
        <li>Calorías/día <span class="dim">2100 kcal</span></li>
        <li>Próxima revisión <span class="dim">03/oct</span></li>
      </ul>
    </div>
  </div>

</div>

<div class="NavBar">
  <div class="NavBar-inner" id="navBar">
    <button class="NavBar-item" data-target="secToday" data-icon="calendar_month" title="Semana"></button>
    <button class="NavBar-item" data-target="secToday" data-icon="restaurant" title="Hoy"></button>
    <button class="NavBar-item" data-target="__add" data-icon="add_circle" title="Agregar"></button>
    <button class="NavBar-item" data-target="secStats" data-icon="bar_chart" title="Resumen"></button>
    <button class="NavBar-item" data-target="secProfile" data-icon="person" title="Perfil"></button>
  </div>
</div>

<script>
(function(){

  // ---------- Theme ----------
  var root = document.documentElement;
  var themeIcon = document.getElementById('themeIcon');

  function applyTheme(t){
    root.setAttribute('data-theme', t);
    themeIcon.textContent = t === 'dark' ? 'light_mode' : 'dark_mode';
  }
  function getStoredTheme(){
    try{ return localStorage.getItem('nutrideck-theme'); }catch(e){ return null; }
  }
  function storeTheme(t){
    try{ localStorage.setItem('nutrideck-theme', t); }catch(e){}
  }
  var initialTheme = getStoredTheme() || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  applyTheme(initialTheme);

  document.getElementById('btnTheme').addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    applyTheme(next);
    storeTheme(next);
  });

  // ---------- Data ----------
  var DOWS = ["LUN","MAR","MIÉ","JUE","VIE","SÁB","DOM"];
  var COLORS = ["c1","c2","c3","c4","c5"];

  function buildMeals(seed){
    var base = [
      {time:"7:30",  tag:"Desayuno", name:"Avena con fruta y nuez",      desc:"1 taza avena · 1 plátano · 10 nueces"},
      {time:"10:30", tag:"Colación", name:"Yogurt griego + granola",     desc:"1 yogurt natural · 2 cdas granola"},
      {time:"14:00", tag:"Comida",   name:"Pollo a la plancha",          desc:"150g pollo · arroz · ensalada verde"},
      {time:"17:30", tag:"Colación", name:"Fruta + puñado de almendras", desc:"1 manzana · 10 almendras"},
      {time:"20:30", tag:"Cena",     name:"Salmón con verduras",         desc:"120g salmón · brócoli al vapor"}
    ];
    return base.map(function(m,i){
      return {
        id: seed + "-" + i,
        time:m.time, tag:m.tag, name:m.name, desc:m.desc,
        color: COLORS[i % COLORS.length]
      };
    });
  }

  var today = new Date();
  var days = [];
  for(var i=0;i<7;i++){
    var d = new Date(today);
    d.setDate(today.getDate() - today.getDay() + 1 + i);
    days.push({
      id:i,
      dow:DOWS[i],
      num:d.getDate(),
      pending: buildMeals("d"+i),
      done: []
    });
  }
  var activeDay = Math.min(Math.max(today.getDay()-1,0),6);

  // ---------- DOM refs ----------
  var dayRail = document.getElementById('dayRail');
  var stackEl = document.getElementById('stack');
  var doneRowEl = document.getElementById('doneRow');
  var dayCountEl = document.getElementById('dayCount');
  var weekGrid = document.getElementById('weekGrid');
  var progressRows = document.getElementById('progressRows');

  // ---------- Day rail ----------
  function renderDayRail(){
    dayRail.innerHTML = "";
    days.forEach(function(day){
      var allDone = day.pending.length === 0;
      var el = document.createElement('div');
      el.className = 'DayCard' + (day.id===activeDay ? ' is-active':'') + (allDone ? ' is-done':'');
      el.innerHTML =
        '<span class="DayCard-dow">'+day.dow+'</span>' +
        '<span class="DayCard-num">'+day.num+'</span>' +
        '<span class="DayCard-dot"></span>';
      el.addEventListener('click', function(){
        activeDay = day.id;
        renderAll();
      });
      dayRail.appendChild(el);
    });
    var activeEl = dayRail.children[activeDay];
    if(activeEl) activeEl.scrollIntoView({inline:'center', block:'nearest'});
  }

  // ---------- Rolodex stack (peek cards fan out upward, front sits at the bottom) ----------
  var PEEK = 20;
  var MAX_VISIBLE = 4;

  function renderStack(){
    stackEl.innerHTML = "";
    var day = days[activeDay];
    var pending = day.pending;

    dayCountEl.textContent = day.done.length + "/" + (day.done.length + pending.length);

    if(pending.length === 0){
      var empty = document.createElement('div');
      empty.className = 'Stack-empty';
      empty.textContent = '¡Todas las comidas de hoy están completas!';
      stackEl.appendChild(empty);
      renderDoneRow();
      return;
    }

    var visible = pending.slice(0, MAX_VISIBLE);
    visible.forEach(function(meal, idx){
      var card = document.createElement('div');
      var isFront = idx === 0;
      card.className = 'MealCard ' + meal.color + (isFront ? ' is-front':' is-peek');
      card.dataset.id = meal.id;

      card.style.zIndex = (MAX_VISIBLE - idx);
      card.style.transform = 'translateY(-'+(idx*PEEK)+'px) scale('+(1 - idx*0.035)+')';
      card.style.opacity = idx===0 ? 1 : Math.max(0.55, 1 - idx*0.16);

      card.innerHTML =
        '<div class="MealCard-top">' +
          '<span class="MealCard-time mono">'+meal.time+'</span>' +
          '<span class="MealCard-tag">'+meal.tag+'</span>' +
        '</div>' +
        '<div class="MealCard-name">'+meal.name+'</div>' +
        (isFront ? '<div class="MealCard-desc">'+meal.desc+'</div>' : '') +
        '<div class="MealCard-foot">' +
          '<span class="MealCard-hint">'+(isFront ? '← completar · después →' : '')+'</span>' +
          (isFront ? '<div class="MealCard-actions"><button class="MealCard-actionBtn" data-action="skip"><span class="material-symbols-rounded">skip_next</span></button><button class="MealCard-actionBtn" data-action="done"><span class="material-symbols-rounded">check</span></button></div>' : '') +
        '</div>' +
        (isFront ? '<div class="SwipeGhost left"><span class="material-symbols-rounded">check_circle</span>completada</div><div class="SwipeGhost right">después<span class="material-symbols-rounded">skip_next</span></div>' : '');

      if(isFront){
        attachSwipe(card, meal);
        card.querySelector('[data-action="done"]').addEventListener('click', function(e){
          e.stopPropagation();
          completeMeal(meal.id);
        });
        card.querySelector('[data-action="skip"]').addEventListener('click', function(e){
          e.stopPropagation();
          skipToBack(meal.id);
        });
      } else {
        card.addEventListener('click', function(){
          selectCard(meal.id);
        });
      }

      stackEl.appendChild(card);
    });

    renderDoneRow();
  }

  function renderDoneRow(){
    var day = days[activeDay];
    doneRowEl.innerHTML = "";
    day.done.forEach(function(meal){
      var chip = document.createElement('div');
      chip.className = 'DoneChip';
      chip.innerHTML = '<span class="material-symbols-rounded is-filled">check_circle</span>' + meal.time + ' · ' + meal.name;
      chip.addEventListener('click', function(){ undoComplete(meal.id); });
      doneRowEl.appendChild(chip);
    });
  }

  function completeMeal(id){
    var day = days[activeDay];
    var idx = day.pending.findIndex(function(m){return m.id===id;});
    if(idx===-1) return;
    var meal = day.pending.splice(idx,1)[0];
    day.done.push(meal);
    renderAll();
  }

  function skipToBack(id){
    var day = days[activeDay];
    var idx = day.pending.findIndex(function(m){return m.id===id;});
    if(idx===-1) return;
    var meal = day.pending.splice(idx,1)[0];
    day.pending.push(meal);
    renderAll();
  }

  function selectCard(id){
    var day = days[activeDay];
    var idx = day.pending.findIndex(function(m){return m.id===id;});
    if(idx<=0) return;
    var meal = day.pending.splice(idx,1)[0];
    day.pending.unshift(meal);
    renderAll();
  }

  function undoComplete(id){
    var day = days[activeDay];
    var idx = day.done.findIndex(function(m){return m.id===id;});
    if(idx===-1) return;
    var meal = day.done.splice(idx,1)[0];
    day.pending.unshift(meal);
    renderAll();
  }

  function attachSwipe(card, meal){
    var ghostLeft = card.querySelector('.SwipeGhost.left');
    var ghostRight = card.querySelector('.SwipeGhost.right');
    var startX=0, startY=0, dx=0, dragging=false;

    function pointerDown(e){
      dragging = true;
      card.classList.add('is-dragging');
      startX = (e.touches ? e.touches[0].clientX : e.clientX);
      startY = (e.touches ? e.touches[0].clientY : e.clientY);
      document.addEventListener('mousemove', pointerMove);
      document.addEventListener('mouseup', pointerUp);
      document.addEventListener('touchmove', pointerMove, {passive:false});
      document.addEventListener('touchend', pointerUp);
    }
    function pointerMove(e){
      if(!dragging) return;
      var x = (e.touches ? e.touches[0].clientX : e.clientX);
      var y = (e.touches ? e.touches[0].clientY : e.clientY);
      dx = x - startX;
      var dy = y - startY;
      if(Math.abs(dx) > Math.abs(dy) && e.cancelable) e.preventDefault();
      var rot = dx/26;
      card.style.transform = 'translate('+dx+'px, 0) rotate('+rot+'deg)';
      ghostLeft.style.opacity = Math.min(Math.max(-dx/110, 0), 1);
      ghostRight.style.opacity = Math.min(Math.max(dx/110, 0), 1);
    }
    function pointerUp(){
      dragging = false;
      card.classList.remove('is-dragging');
      document.removeEventListener('mousemove', pointerMove);
      document.removeEventListener('mouseup', pointerUp);
      document.removeEventListener('touchmove', pointerMove);
      document.removeEventListener('touchend', pointerUp);

      if(dx < -80){
        card.style.transition = 'transform .26s ease, opacity .26s ease';
        card.style.transform = 'translate(-130%, 0) rotate(-10deg)';
        card.style.opacity = 0;
        setTimeout(function(){ completeMeal(meal.id); }, 200);
      } else if(dx > 80){
        card.style.transition = 'transform .26s ease, opacity .26s ease';
        card.style.transform = 'translate(130%, 0) rotate(10deg)';
        card.style.opacity = 0;
        setTimeout(function(){ skipToBack(meal.id); }, 200);
      } else {
        card.style.transform = 'translateY(0) scale(1)';
        ghostLeft.style.opacity = 0;
        ghostRight.style.opacity = 0;
      }
      dx = 0;
    }

    card.addEventListener('mousedown', pointerDown);
    card.addEventListener('touchstart', pointerDown, {passive:true});
  }

  // ---------- Stats ----------
  function renderWeekGrid(){
    weekGrid.innerHTML = "";
    days.forEach(function(day){
      var full = day.pending.length === 0;
      var cell = document.createElement('div');
      cell.className = 'WeekGrid-cell' + (day.id===activeDay ? ' is-active':'') + (full && day.id!==activeDay ? ' is-full':'');
      cell.textContent = day.dow[0];
      weekGrid.appendChild(cell);
    });
  }

  function renderProgress(){
    progressRows.innerHTML = "";
    var day = days[activeDay];
    var all = day.done.concat(day.pending).sort(function(a,b){
      return a.time.localeCompare(b.time, undefined, {numeric:true});
    });
    var doneIds = day.done.map(function(m){return m.id;});
    all.forEach(function(meal){
      var isDone = doneIds.indexOf(meal.id) !== -1;
      var pct = isDone ? 100 : 0;
      var row = document.createElement('div');
      row.className = 'ProgressRow';
      row.innerHTML =
        '<span class="ProgressRow-label">'+meal.tag+' '+meal.time+'</span>' +
        '<span class="ProgressBar"><span style="width:'+pct+'%"></span></span>' +
        '<span class="ProgressRow-val mono">'+pct+'%</span>';
      progressRows.appendChild(row);
    });
  }

  function renderAll(){
    renderDayRail();
    renderStack();
    renderWeekGrid();
    renderProgress();
  }

  // ---------- Nav bar ----------
  var navBar = document.getElementById('navBar');
  var navButtons = Array.prototype.slice.call(navBar.querySelectorAll('.NavBar-item'));
  navButtons.forEach(function(btn){
    var icon = document.createElement('span');
    icon.className = 'material-symbols-rounded';
    icon.textContent = btn.dataset.icon;
    btn.appendChild(icon);

    btn.addEventListener('click', function(){
      if(btn.dataset.target === '__add'){
        document.getElementById('btnAddMeal').click();
        return;
      }
      navButtons.forEach(function(b){
        b.classList.remove('is-active');
        b.querySelector('.material-symbols-rounded').classList.remove('is-filled');
      });
      btn.classList.add('is-active');
      btn.querySelector('.material-symbols-rounded').classList.add('is-filled');
      var target = document.getElementById(btn.dataset.target);
      if(target) target.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
  navButtons[1].classList.add('is-active');
  navButtons[1].querySelector('.material-symbols-rounded').classList.add('is-filled');

  // ---------- Actions ----------
  document.getElementById('btnAddMeal').addEventListener('click', function(){
    alert('Wireframe: aquí abriría el formulario para agregar una comida/colación (hora, nombre, macros, foto).');
  });
  document.getElementById('btnDiet').addEventListener('click', function(){
    alert('Wireframe: aquí abriría el flujo para crear/editar el plan de dieta completo.');
  });

  renderAll();
})();
</script>
